name: Android CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v6  # تم التحديث من v4

    - name: Set up JDK 17
      uses: actions/setup-java@v5  # تم التحديث من v4
      with:
        distribution: 'temurin'
        java-version: '17'
        
    # ... بقية الخطوات (البناء والاختبار) تبقى كما هي
